[project]
name = "ComfyUI-ArtThreads"
version = "0.1.0"
description = "ArtThreads UI nodes for ComfyUI: Duration, Load Audio, Video Size, Longest Side, Monitor, and Run Timer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

keywords = ["comfyui", "artthreads", "video", "audio", "minimax-h3"]

[project.urls]
Repository = "https://github.com/Arty-ux/ComfyUI-ArtThreads"
"Bug Tracker" = "https://github.com/Arty-ux/ComfyUI-ArtThreads/issues"

[tool.comfy]
PublisherId = "arty-ux"
DisplayName = "ArtThreads"
includes = []

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
python_files = ["test_*.py"]
